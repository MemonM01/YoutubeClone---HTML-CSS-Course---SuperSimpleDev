<!DOCTYPE html>
<html>
  <head>
    <title>Position Practice
    </title>
  </head>
  <body style="
    height: 10000px;
    padding-left: 80px;
  ">
    <div style="
    background-color: black;
    color: white;
    position: fixed;
    top: 0px;
    left: 0px;
    right: 0px;
    height: 50px;
    z-index: 10;
    ">
    Header</div>
    <div style="
      background-color: green;
      color: white;
      position: fixed;
      left: 0;
      bottom: 0;
      top: 50px;
      width: 72px;
      ">
      Sidebar
    </div>
    <div style="
    position: absolute;
    background-color: red;
    color: white;
    right: 10px;
    top: 100px;
    ">
      Absolute
    </div>
    <div style="
    background-color: lightblue; 
    width: 200px;
    height: 200px;
    margin-top: 60px;">
     Div 1
     
    </div>
    <div style="
    background-color: lightpink;
    height: 200px;
    width: 200px;
    position: relative;">
     Div 2
      <div style="
      position: absolute;
      background-color: black;
      color: white;
      right: 10px;
      bottom: 10px;
      ">
        5:00
      </div>
    </div>
  </body>
</html>
