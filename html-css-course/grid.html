<!DOCTYPE html>
<html>
  <head>
    <title>Grid Practice</title>
  </head>
  <body style="padding-bottom: 1000px;">
    <div style="
      display: grid;
      grid-template-columns: 100px 100px 200px;">

      <div style = "background-color: lightblue;">Div 1</div>
      <div style="background-color: lightpink;">Div 2<p>girl</p></div>
      <div style="background-color: lightgreen;">Div 3</div>
      <div style="background-color: lightpink;">Div 4</div> 
    </div>

    <div style="
      display: grid;
      grid-template-columns: 100px 1fr;"
    >
      <div style="background-color: lightblue;">Div 1</div>
      <div style="background-color: lightpink;">1fr</div>
    </div>


    <div style="
      display: grid;
      grid-template-columns: 100px 1fr 2fr;"
    >
      <div style="background-color: lightblue;">Div 1</div>
      <div style="background-color: lightpink;">1fr</div>
      <div style="background-color: lightblue;">2fr</div>
    </div>

    <div style="
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      column-gap: 20px;
      row-gap: 20px;"
    >
      <div style="background-color: lightblue; height: 200px;">Div 1</div>
      <div style="background-color: lightpink; height: 200px">1fr</div>
      <div style="background-color: lightgreen; height: 200px;">1fr</div>
      <div style="background-color: lightgreen; height: 200px;">1fr</div>
      <div style="background-color: lightblue; height: 200px;">Div 1</div>
      <div style="background-color: lightpink; height: 200px">1fr</div>
    </div>

  </body>
</html>
